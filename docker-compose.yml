services:
  # Selenoid - gerenciador de browsers com VNC
  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    networks:
      - selenium
    ports:
      - "4444:4444"
    volumes:
      - "./config:/etc/selenoid:ro"
      - "./videos:/opt/selenoid/video"
      - "./logs:/opt/selenoid/logs"
      # Docker socket para criar containers de browser
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
      - TZ=America/Sao_Paulo
    command: [
      "-conf", "/etc/selenoid/browsers.json",
      "-video-output-dir", "/opt/selenoid/video",
      "-log-output-dir", "/opt/selenoid/logs",
      "-container-network", "automacao-docker_selenium",
      "-limit", "10",
      "-timeout", "5m",
      "-session-attempt-timeout", "2m",
      "-service-startup-timeout", "2m"
    ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Selenoid UI - interface com visualizacao VNC em tempo real
  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    networks:
      - selenium
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Sao_Paulo
    command: [
      "--selenoid-uri", "http://selenoid:4444",
      "--listen", ":8080"
    ]
    depends_on:
      selenoid:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard - painel de monitoramento com grid VNC
  dashboard:
    image: nginx:alpine
    container_name: dashboard
    networks:
      - selenium
    ports:
      - "8888:80"
    volumes:
      - "./dashboard:/usr/share/nginx/html:ro"
      - "./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - selenoid-ui
      - selenoid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Limpeza automatica de videos antigos (ultimas 24h)
  video-cleaner:
    image: alpine:latest
    container_name: video-cleaner
    volumes:
      - "./videos:/videos"
    command: >
      sh -c "while true; do
        echo '[Video Cleaner] Iniciando limpeza...';
        find /videos -type f -name '*.mp4' -mtime +1 -delete 2>/dev/null;
        find /videos -type f -name '*.log' -mtime +1 -delete 2>/dev/null;
        echo '[Video Cleaner] Limpeza concluida em '$(date);
        sleep 3600;
      done"
    restart: unless-stopped

networks:
  selenium:
    name: automacao-docker_selenium
    driver: bridge
