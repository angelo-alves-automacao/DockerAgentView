services:
  # Selenoid - gerenciador de browsers
  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    networks:
      - selenium
    ports:
      - "4444:4444"
    volumes:
      - "./config:/etc/selenoid:ro"
      - "./videos:/opt/selenoid/video"
      # Windows Docker Desktop: usa pipe nomeado ou socket do WSL2
      - "//var/run/docker.sock:/var/run/docker.sock"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
      - DOCKER_HOST=unix:///var/run/docker.sock
    command: [
      "-conf", "/etc/selenoid/browsers.json",
      "-video-output-dir", "/opt/selenoid/video",
      "-log-output-dir", "/opt/selenoid/logs",
      "-container-network", "automacao-docker_selenium",
      "-limit", "10",
      "-timeout", "2m"
    ]

  # Selenoid UI - interface para ver gravações e status
  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    networks:
      - selenium
    ports:
      - "8080:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid

  # Chrome workers com noVNC (tempo real)
  # Para escalar dinamicamente: docker compose up -d --scale chrome-worker=N
  # Exemplo: docker compose up -d --scale chrome-worker=3
  # Para reduzir: docker compose up -d --scale chrome-worker=1
  chrome-worker:
    image: selenium/standalone-chrome:latest
    networks:
      - selenium
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_VNC_NO_PASSWORD=1
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
    volumes:
      - /dev/shm:/dev/shm
    # Expor portas para acesso direto (opcional, para debug)
    # ports:
    #   - "7900:7900"  # VNC
    #   - "4444:4444"  # Selenium (se não usar Selenoid)


  # Dashboard - painel único para TV
  dashboard:
    image: nginx:alpine
    container_name: dashboard
    networks:
      - selenium
    ports:
      - "8888:80"
    volumes:
      - "./dashboard:/usr/share/nginx/html:ro"
      - "./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - selenoid-ui
      - selenoid
      - chrome-worker

  # Limpeza automática de vídeos antigos (últimas 24h)
  video-cleaner:
    image: alpine:latest
    container_name: video-cleaner
    volumes:
      - "./videos:/videos"
    command: >
      sh -c "while true; do
        find /videos -type f -name '*.mp4' -mtime +1 -delete;
        echo 'Limpeza de vídeos concluída';
        sleep 3600;
      done"
    restart: unless-stopped

  

networks:
  selenium:
    name: automacao-docker_selenium
    driver: bridge